upstream frontend_server {
    server frontend:80;
}

upstream backend_server {
    server backend:8000;
}

server {
    listen 80;

    # 1. Frontend React Routing
    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSockets support for Vite Hot Module Replacement (HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2. FastAPI Interactive Docs Routing
    location /docs {
        proxy_pass http://backend_server; # Passed directly to let FastAPI handle its internal routes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. FastAPI Core Schema JSON Routing (Fixes your exact error)
    location /openapi.json {
        proxy_pass http://backend_server; # Match directly to the container root
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Global API Endpoint Routing
    location /api/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}