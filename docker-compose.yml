
services:
  # 1. THE GATEWAY (The Only Public Entrance)
  nginx:
    build: ./nginx
    container_name: nexacart_gateway
    ports:
      - "80:80"  # Access everything at http://localhost
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - main-network

  # 2. DATABASE (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: nexacart_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nexacart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nexacart"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - main-network

  # 3. DB MANAGEMENT
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080" # Left open for DB management
    depends_on:
      - db
    networks:
      - main-network

  # 4. CACHE (Redis)
  redis:
    image: redis:alpine
    restart: always
    command: redis-server --requirepass redis_password123
    networks:
      - main-network

  # 5. BACKEND (FastAPI)
  backend:
    build: ./backend
    container_name: nexacart_backend
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://admin:password123@db/nexacart
      - REDIS_URL=redis://:redis_password123@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - main-network
    ports:
      - "8000:8000"  

  # 6. WORKER (Celery)
  worker:
    build: ./backend
    container_name: nexacart_worker
    working_dir: /app
    volumes:
      - ./backend:/app 
    command: celery -A app.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://admin:password123@db/nexacart
      - REDIS_URL=redis://:redis_password123@redis:6379/0
    depends_on:
      - redis
      - db
    networks:
      - main-network

  # 7. FRONTEND (React Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: nexacart_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api/v1
    depends_on:
      - backend
    networks:
      - main-network
      
  # 8. Prometheus Service
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - main-network

  # 9. Grafana Service
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - main-network

  # 10. Node Exporter Service
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    ports:
      - "9100:9100"
    networks:
      - main-network
  # 11. cadvisor Service
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
    - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - main-network    

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  main-network:
    driver: bridge
    