name: NexaCart CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # STEP 1: Continuous Integration (Testing & Linting)
  ci:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    # Test the Backend
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # pip install pytest (uncomment when adding unit tests)

    # Test the Frontend
    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: frontend/package.json
        
    - name: Install Frontend dependencies & Build Test
      run: |
        cd frontend
        npm install
        npm run build

  # STEP 2: Continuous Delivery (Build & Publish Docker Images)
  cd:
    needs: ci # Only runs if the CI step passes perfectly
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    # Setup automated building tools
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Authenticate into Amazon ECR
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/GitHubActionsTerraformRole
        aws-region: eu-west-1

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Build & Push Production Backend Image
    - name: Build and push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/nexacart-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Build & Push Production Frontend Image (Nginx Native Single Stage)
    - name: Build and push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/nexacart-backend:latest
       
        cache-from: type=gha
        cache-to: type=gha,mode=max